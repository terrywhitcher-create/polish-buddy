<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Polish Buddy 🇵🇱</title>
<style>
:root{--bg:#f7f7f8;--card:#fff;--text:#171717;--muted:#6b7280;--accent:#c8102e;--green:#16834b;--border:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:90px}.top{padding:28px 20px 12px;background:#fff;border-bottom:1px solid var(--border)}
h1{font-size:28px;margin:0 0 4px}.sub{color:var(--muted)}.flag{font-size:38px}.content{padding:18px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}
.progress{height:10px;background:#eee;border-radius:20px;overflow:hidden}.bar{height:100%;background:var(--green);width:0%;transition:.3s}
.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700;background:var(--accent);color:white;margin-top:10px}.btn.secondary{background:#f1f1f1;color:#222}.btn.correct{background:var(--green)}.lesson{display:flex;align-items:center;gap:14px}.icon{font-size:30px}.lesson b{display:block}.lesson small{color:var(--muted)}.hidden{display:none}.word{font-size:34px;font-weight:800;text-align:center;margin:15px 0 5px}.pron{text-align:center;color:var(--muted);font-style:italic}.meaning{text-align:center;font-size:19px;margin:12px}.answers button{background:#fff;color:#222;border:1px solid var(--border);text-align:left}.feedback{padding:12px;border-radius:12px;margin-top:12px;font-weight:600}.ok{background:#e7f7ee;color:#12623a}.bad{background:#fdeaea;color:#9d1826}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:center}.nav-inner{max-width:520px;width:100%;display:flex}.nav button{flex:1;border:0;background:#fff;padding:12px 4px;color:#555}.nav button.active{color:var(--accent);font-weight:800}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="flag">🇵🇱</div><h1>Polish Buddy</h1><div class="sub">Learn Polish step by step</div></header>
<main class="content">
<section id="home">
<div class="card"><h2>Today's progress</h2><div class="progress"><div class="bar" id="bar"></div></div><p><b id="progressText">0%</b> complete • 🔥 <span id="streak">1</span> day streak</p><button class="btn" onclick="startLesson(0)">Start today's lesson</button></div>
<div class="card"><h2>Beginner lessons</h2><div id="lessonList"></div></div>
</section>

<section id="lesson" class="hidden">
<div class="card">
<div class="sub" id="lessonCount"></div><h2 id="lessonTitle"></h2>
<div class="word" id="polish"></div><div class="pron" id="pron"></div><div class="meaning" id="meaning"></div>
<button class="btn secondary" onclick="speak()">🔊 Hear pronunciation</button>
<button class="btn" onclick="showQuiz()">Practice this word</button>
</div>
</section>

<section id="quiz" class="hidden">
<div class="card"><div class="sub" id="quizCount"></div><h2>Quick quiz</h2><p id="question"></p><div class="answers" id="answers"></div><div id="feedback"></div><button id="nextBtn" class="btn hidden" onclick="nextQuestion()">Next</button></div>
</section>

<section id="stats" class="hidden">
<div class="card"><h2>🏆 Your progress</h2><p><b id="wordsLearned">0</b> words practised</p><p><b id="lessonsDone">0</b> lessons completed</p><div class="progress"><div class="bar" id="bar2"></div></div></div>
<div class="card"><h2>💡 Tip</h2><p>Don't worry about getting everything right. Repeating words regularly is one of the best ways to remember them.</p></div>
</section>
</main>
<div class="nav"><div class="nav-inner"><button class="active" onclick="tab('home',this)">🏠<br>Home</button><button onclick="tab('stats',this)">🏆<br>Progress</button></div></div>
</div>
<script>
const lessons=[
["👋","Greetings","Dzień dobry","Jyen DOH-bri","Good morning / Hello"],
["🙋","Introductions","Jak masz na imię?","Yak mash nah EE-myeh","What is your name?"],
["😊","How are you?","Jak się masz?","Yak shyeh mash","How are you?"],
["👨‍👩‍👧","Family","rodzina","roh-DZEE-nah","family"],
["🔢","Numbers","jeden","YEH-den","one"],
["🍞","Food","chleb","hlep","bread"],
["☕","Drinks","kawa","KAH-vah","coffee"],
["🏠","Home","dom","dom","house / home"],
["🛒","Shopping","Ile to kosztuje?","EE-leh toh kosh-TOO-yeh","How much does it cost?"],
["❤️","Useful phrase","Dziękuję","jen-KOO-yeh","Thank you"]
];
let state=JSON.parse(localStorage.getItem("polishBuddy")||'{"done":0,"words":0,"streak":1}');
let current=0, quizDone=false;
const $=id=>document.getElementById(id);
function renderLessons(){$("lessonList").innerHTML=lessons.map((l,i)=>`<div class="card lesson" onclick="startLesson(${i})"><div class="icon">${l[0]}</div><div><b>${i+1}. ${l[1]}</b><small>${l[2]} — ${l[4]}</small></div></div>`).join("")}
function update(){let p=Math.round(state.done/lessons.length*100);$("bar").style.width=p+"%";$("bar2").style.width=p+"%";$("progressText").textContent=p+"%";$("streak").textContent=state.streak;$("wordsLearned").textContent=state.words;$("lessonsDone").textContent=state.done;localStorage.setItem("polishBuddy",JSON.stringify(state))}
function tab(name,el){["home","lesson","quiz","stats"].forEach(x=>$(x).classList.toggle("hidden",x!==name));document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));if(el)el.classList.add("active");}
function startLesson(i){current=i;let l=lessons[i];$("lessonCount").textContent=`Lesson ${i+1} of ${lessons.length}`;$("lessonTitle").textContent=l[1];$("polish").textContent=l[2];$("pron").textContent="/ "+l[3]+" /";$("meaning").textContent=l[4];tab("lesson")}
function speak(){let l=lessons[current];if("speechSynthesis"in window){let u=new SpeechSynthesisUtterance(l[2]);u.lang="pl-PL";speechSynthesis.cancel();speechSynthesis.speak(u)}}
function showQuiz(){let l=lessons[current];$("quizCount").textContent=`Practice • ${current+1}/${lessons.length}`;$("question").textContent=`What does “${l[2]}” mean?`;let choices=[l[4]];while(choices.length<4){let x=lessons[Math.floor(Math.random()*lessons.length)][4];if(!choices.includes(x))choices.push(x)}choices.sort(()=>Math.random()-.5);$("answers").innerHTML=choices.map(c=>`<button class="btn" onclick="answer(this,${JSON.stringify(c)} )">${c}</button>`).join("");$("feedback").innerHTML="";$("nextBtn").classList.add("hidden");tab("quiz")}
function answer(btn,c){if(quizDone)return;quizDone=true;let correct=lessons[current][4];document.querySelectorAll(".answers button").forEach(b=>b.disabled=true);if(c===correct){btn.classList.add("correct");$("feedback").className="feedback ok";$("feedback").textContent="✓ Correct! Well done.";state.words++;}else{btn.style.borderColor="#c8102e";$("feedback").className="feedback bad";$("feedback").textContent=`Not quite. The answer is: ${correct}`}$("nextBtn").classList.remove("hidden");update()}
function nextQuestion(){quizDone=false;if(current<lessons.length-1){state.done=Math.max(state.done,current+1);update();startLesson(current+1)}else{state.done=lessons.length;update();tab("home");alert("🎉 Great job! You completed the beginner course.");}}
renderLessons();update();
</script>
</body>
</html>
